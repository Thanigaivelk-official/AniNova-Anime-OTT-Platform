services:
  - type: web
    name: aninova-anime-stream
    runtime: python
    region: oregon
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: USE_SQLITE
        value: "True"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
