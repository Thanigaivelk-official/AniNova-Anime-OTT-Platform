<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamFlix - Online Streaming Platform</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        body {
            background-color: #141414;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-custom {
            background: #1f1f1f;
            border: 1px solid #333333;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            max-width: 650px;
            width: 100%;
        }
        .brand-badge {
            color: #E50914;
            font-weight: 800;
            letter-spacing: 2px;
            font-size: 2rem;
            text-transform: uppercase;
        }
        .status-pill {
            background-color: #27ae60;
            color: white;
            font-size: 0.85rem;
            padding: 4px 14px;
            border-radius: 20px;
            display: inline-block;
        }
        .module-item {
            background: #2a2a2a;
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="card card-custom mx-auto p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="brand-badge"><i class="fa-solid fa-play-circle text-danger me-2"></i>StreamFlix</div>
                <h5 class="text-secondary mt-1">Enterprise Video Streaming Platform</h5>
                <span class="status-pill mt-2"><i class="fa-solid fa-circle-check me-1"></i> {{ phase }}</span>
            </div>
            
            <p class="text-light text-center">
                Django 5.1 & Full Project Architecture successfully initialized!
            </p>

            <h6 class="text-uppercase text-secondary fw-bold mt-3 mb-2" style="font-size: 0.8rem; letter-spacing: 1px;">Configured Modules:</h6>
            <div class="row g-2">
                <div class="col-6"><div class="module-item"><i class="fa-solid fa-users text-danger me-2"></i>accounts</div></div>
                <div class="col-6"><div class="module-item"><i class="fa-solid fa-film text-danger me-2"></i>movies</div></div>
                <div class="col-6"><div class="module-item"><i class="fa-solid fa-video text-danger me-2"></i>streaming</div></div>
                <div class="col-6"><div class="module-item"><i class="fa-solid fa-credit-card text-danger me-2"></i>subscriptions</div></div>
                <div class="col-6"><div class="module-item"><i class="fa-solid fa-bookmark text-danger me-2"></i>watchlist</div></div>
                <div class="col-6"><div class="module-item"><i class="fa-solid fa-receipt text-danger me-2"></i>payments</div></div>
                <div class="col-6"><div class="module-item"><i class="fa-solid fa-wand-magic-sparkles text-danger me-2"></i>recommendations</div></div>
                <div class="col-6"><div class="module-item"><i class="fa-solid fa-chart-line text-danger me-2"></i>dashboard</div></div>
            </div>

            <div class="mt-4 pt-3 border-top border-secondary text-center text-secondary small">
                Ready to proceed to <strong>Phase 2: Database Design & Models (MySQL)</strong>.
            </div>
        </div>
    </div>
</body>
</html>
